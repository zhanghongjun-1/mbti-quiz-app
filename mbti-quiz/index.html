<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MBTI 性格测评 · 星辰测评</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }

:root {
  --c-bg: #f0f2f5;
  --c-card: #ffffff;
  --c-primary: #6366f1;
  --c-primary-d: #4f46e5;
  --c-primary-l: #e0e7ff;
  --c-accent: #f59e0b;
  --c-text: #1e293b;
  --c-text-l: #64748b;
  --c-border: #e2e8f0;
  --shadow: 0 2px 12px rgba(0,0,0,0.06);
  --shadow-lg: 0 12px 48px rgba(0,0,0,0.10);
  --radius: 14px;
  --radius-sm: 10px;
  --trs: all .3s ease;
}

body {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
  background: var(--c-bg);
  color: var(--c-text);
  line-height: 1.65;
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: 0 0 32px;
}

/* ===== 顶栏 ===== */
.topbar {
  width: 100%;
  max-width: 640px;
  padding: 18px 20px;
  display: flex;
  align-items: center;
  gap: 10px;
}
.topbar .logo-dot {
  width: 36px; height: 36px;
  border-radius: 10px;
  background: linear-gradient(135deg, var(--c-primary), #818cf8);
  display: flex; align-items: center; justify-content: center;
  color: #fff; font-weight: 800; font-size: 16px;
  flex-shrink: 0;
}
.topbar .logo-text {
  font-size: 18px; font-weight: 700; color: var(--c-text);
}
.topbar .logo-sub {
  font-size: 12px; color: var(--c-text-l); margin-top: 1px;
}

/* ===== 主容器 ===== */
.app {
  width: 100%;
  max-width: 640px;
  padding: 0 16px;
}

/* ===== 欢迎页 ===== */
.screen { display: none; }
.screen.active { display: block; }

.welcome-card {
  background: var(--c-card);
  border-radius: var(--radius);
  box-shadow: var(--shadow-lg);
  padding: 48px 36px 44px;
  text-align: center;
  margin-top: 20px;
}
.welcome-card h1 {
  font-size: 28px; margin-bottom: 10px;
}
.welcome-card .sub {
  font-size: 15px; color: var(--c-text-l); margin-bottom: 32px;
}
.welcome-stats {
  display: flex; justify-content: center; gap: 28px; margin-bottom: 36px; flex-wrap: wrap;
}
.welcome-stats .item { text-align: center; }
.welcome-stats .num { font-size: 26px; font-weight: 800; color: var(--c-primary); }
.welcome-stats .label { font-size: 12px; color: var(--c-text-l); margin-top: 2px; }

/* ===== 按钮 ===== */
.btn {
  display: inline-block; padding: 14px 40px;
  border: none; border-radius: var(--radius-sm);
  font-size: 16px; font-weight: 600; cursor: pointer;
  transition: var(--trs); text-decoration: none;
}
.btn-primary { background: var(--c-primary); color: #fff; }
.btn-primary:hover { background: var(--c-primary-d); transform: translateY(-1px); box-shadow: 0 6px 16px rgba(99,102,241,.35); }
.btn-primary:disabled { opacity: .45; cursor: not-allowed; transform: none; box-shadow: none; }
.btn-outline { background: transparent; color: var(--c-primary); border: 2px solid var(--c-primary); }
.btn-outline:hover { background: var(--c-primary-l); }
.btn-sm { padding: 10px 22px; font-size: 14px; }
.btn-ghost { background: #f1f5f9; color: var(--c-text-l); border: none; }
.btn-ghost:hover { background: #e2e8f0; }
.btn-ghost:disabled { opacity: .45; cursor: not-allowed; }

/* ===== 答题页 ===== */
.quiz-head { margin-bottom: 20px; }
.progress-track {
  height: 8px; background: var(--c-border); border-radius: 4px; overflow: hidden; margin-bottom: 14px;
}
.progress-fill {
  height: 100%; background: linear-gradient(90deg, var(--c-primary), #818cf8);
  border-radius: 4px; transition: width .4s ease;
}
.quiz-meta {
  display: flex; justify-content: space-between; align-items: center;
  font-size: 14px; color: var(--c-text-l);
}
.quiz-meta .dim-tag {
  display: inline-block; padding: 3px 10px;
  background: var(--c-primary-l); color: var(--c-primary-d);
  border-radius: 6px; font-size: 12px; font-weight: 600;
}

.q-card {
  background: var(--c-card); border-radius: var(--radius);
  box-shadow: var(--shadow); padding: 32px 26px; margin-bottom: 20px;
}
.q-text {
  font-size: 19px; font-weight: 600; text-align: center;
  margin-bottom: 24px; line-height: 1.5;
}
.opts { display: flex; flex-direction: column; gap: 12px; }
.opt {
  display: flex; align-items: center; width: 100%;
  padding: 16px 18px; background: #f8fafc;
  border: 2px solid var(--c-border); border-radius: var(--radius-sm);
  cursor: pointer; transition: var(--trs);
  font-size: 15px; color: var(--c-text); text-align: left;
}
.opt:hover { border-color: var(--c-primary); background: var(--c-primary-l); }
.opt.sel { border-color: var(--c-primary); background: var(--c-primary-l); color: var(--c-primary-d); font-weight: 600; }
.opt .dot {
  width: 28px; height: 28px; border-radius: 50%;
  border: 2px solid var(--c-border); margin-right: 14px;
  flex-shrink: 0; font-weight: 700; font-size: 13px;
  color: var(--c-text-l); display: flex; align-items: center; justify-content: center;
  transition: var(--trs);
}
.opt.sel .dot { border-color: var(--c-primary); background: var(--c-primary); color: #fff; }

.quiz-nav {
  display: flex; justify-content: space-between; align-items: center; gap: 12px;
}

/* ===== 结果页 ===== */
.result-hero {
  background: linear-gradient(135deg, var(--c-primary), #818cf8);
  border-radius: var(--radius); padding: 40px 28px;
  text-align: center; color: #fff; margin-top: 20px;
  box-shadow: var(--shadow-lg);
}
.result-hero .code {
  font-size: 52px; font-weight: 800; letter-spacing: 6px; margin-bottom: 6px;
}
.result-hero .name { font-size: 20px; font-weight: 600; }
.result-hero .nick { font-size: 13px; opacity: .8; margin-top: 4px; }
.result-hero .grp {
  display: inline-block; margin-top: 14px;
  padding: 4px 14px; background: rgba(255,255,255,.2);
  border-radius: 20px; font-size: 13px;
}

.dim-section {
  background: var(--c-card); border-radius: var(--radius);
  box-shadow: var(--shadow); padding: 24px 22px; margin-top: 16px;
}
.dim-section h3 { font-size: 16px; margin-bottom: 16px; }

.dim-row { margin-bottom: 14px; }
.dim-row:last-child { margin-bottom: 0; }
.dim-row .lbl {
  display: flex; justify-content: space-between;
  font-size: 13px; font-weight: 600; margin-bottom: 5px;
}
.dim-row .lbl .a { color: var(--c-primary); }
.dim-row .lbl .b { color: var(--c-text-l); }
.dim-row .bar {
  height: 10px; background: var(--c-border); border-radius: 5px; overflow: hidden;
}
.dim-row .bar .fill {
  height: 100%; border-radius: 5px;
  transition: width 1s ease;
}
.dim-row .desc {
  font-size: 12px; color: var(--c-text-l); margin-top: 5px;
}

.rpt-card {
  background: var(--c-card); border-radius: var(--radius);
  box-shadow: var(--shadow); padding: 24px 22px; margin-top: 16px;
}
.rpt-card h3 { font-size: 16px; margin-bottom: 12px; }
.rpt-card .desc-body { font-size: 15px; color: var(--c-text-l); line-height: 1.75; }
.rpt-card ul { list-style: none; }
.rpt-card ul li {
  padding: 5px 0 5px 20px; position: relative;
  font-size: 14px; color: var(--c-text-l);
}
.rpt-card ul li::before {
  content: ""; position: absolute; left: 0; top: 12px;
  width: 7px; height: 7px; border-radius: 50%; background: var(--c-primary);
}
.rpt-card ul li.w::before { background: var(--c-accent); }

.disclaimer {
  background: #fffbeb; border: 1px solid #fde68a; border-left: 4px solid var(--c-accent);
  border-radius: var(--radius-sm); padding: 14px 18px; margin-top: 16px;
  font-size: 13px; color: #78350f; line-height: 1.6;
}

.result-actions {
  display: flex; justify-content: center; gap: 10px; margin-top: 24px; flex-wrap: wrap;
}

/* ===== 响应式 ===== */
@media (max-width: 480px) {
  .welcome-card { padding: 32px 20px; }
  .welcome-card h1 { font-size: 22px; }
  .welcome-stats { gap: 18px; }
  .q-card { padding: 24px 18px; }
  .q-text { font-size: 17px; }
  .result-hero .code { font-size: 40px; }
  .topbar { padding: 14px 16px; }
}
</style>
</head>
<body>

<div class="topbar">
  <div class="logo-dot">MB</div>
  <div>
    <div class="logo-text">星辰 MBTI 测评</div>
    <div class="logo-sub">了解你的性格类型</div>
  </div>
</div>

<div class="app">

  <!-- ====== 欢迎页 ====== -->
  <div class="screen active" id="s-welcome">
    <div class="welcome-card">
      <h1>MBTI 性格测评</h1>
      <p class="sub">20 道题，约 3 分钟，了解你的 MBTI 性格类型</p>
      <div class="welcome-stats">
        <div class="item"><div class="num">20</div><div class="label">道题目</div></div>
        <div class="item"><div class="num">4</div><div class="label">个维度</div></div>
        <div class="item"><div class="num">16</div><div class="label">种类型</div></div>
        <div class="item"><div class="num">~3</div><div class="label">分钟</div></div>
      </div>
      <button class="btn btn-primary" onclick="goQuiz()">开始测评</button>
    </div>
  </div>

  <!-- ====== 答题页 ====== -->
  <div class="screen" id="s-quiz">
    <div class="quiz-head">
      <div class="progress-track"><div class="progress-fill" id="pBar" style="width:5%"></div></div>
      <div class="quiz-meta">
        <span id="qIdx">第 1 / 20 题</span>
        <span class="dim-tag" id="qDim">E/I 外向 / 内向</span>
      </div>
    </div>
    <div class="q-card">
      <div class="q-text" id="qText">题目加载中…</div>
      <div class="opts" id="qOpts"></div>
    </div>
    <div class="quiz-nav">
      <button class="btn btn-ghost btn-sm" id="btnPrev" onclick="prev()">上一题</button>
      <button class="btn btn-primary btn-sm" id="btnNext" onclick="next()" disabled>下一题</button>
    </div>
  </div>

  <!-- ====== 结果页 ====== -->
  <div class="screen" id="s-result">
    <div class="result-hero">
      <div class="code" id="rCode">INTJ</div>
      <div class="name" id="rName">建筑师</div>
      <div class="nick" id="rNick">The Architect</div>

    <div class="dim-section">

      <div id="rDims"></div>
    </div>

    <div class="rpt-card">
      <h3>性格特点</h3>
      <p class="desc-body" id="rDesc"></p>
    </div>

    <div class="rpt-card">
      <h3>优势</h3>
      <ul id="rStr"></ul>
    </div>

    <div class="rpt-card">
      <h3>注意项</h3>
      <ul id="rWeak"></ul>
    </div>

    <div class="disclaimer">
      本测评仅供娱乐和自我了解，不构成心理诊断或专业建议。MBTI 是一种性格类型参考工具，并非精密的心理测量仪器。如需专业心理咨询，请咨询持有资质的心理专业人士。
    </div>

    <div class="result-actions">
      <button class="btn btn-outline btn-sm" onclick="goQuiz()">重新测试</button>
    </div>
  </div>

</div>

// ====== 状态 ======
var idx = 0;
var ans = new Array(Q.length).fill(null);

// ====== 页面切换 ======
function show(id) {
  document.querySelectorAll(".screen").forEach(function(s){ s.classList.remove("active"); });
  document.getElementById(id).classList.add("active");
  window.scrollTo(0,0);
}

function goQuiz() {
  idx = 0;
  ans = new Array(Q.length).fill(null);
  show("s-quiz");
  renderQ();
}

// ====== 渲染题目 ======
function renderQ() {
  var q = Q[idx];
  var total = Q.length;

  document.getElementById("pBar").style.width = ((idx+1)/total*100) + "%";
  document.getElementById("qIdx").textContent = "第 " + (idx+1) + " / " + total + " 题";
  document.getElementById("qDim").textContent = DIM_LABEL[q.d];
  document.getElementById("qText").textContent = q.t;

  var opts = document.getElementById("qOpts");
  opts.innerHTML =
    '<button class="opt" onclick="pick(\'A\')"><span class="dot">A</span><span>' + q.a + '</span></button>' +
    '<button class="opt" onclick="pick(\'B\')"><span class="dot">B</span><span>' + q.b + '</span></button>';

  if (ans[idx]) {
    var btns = opts.querySelectorAll(".opt");
    if (ans[idx]==="A") btns[0].classList.add("sel");
    else btns[1].classList.add("sel");
  }

  var btnPrev = document.getElementById("btnPrev");
  btnPrev.disabled = idx===0;

  var btnNext = document.getElementById("btnNext");
  btnNext.textContent = idx===total-1 ? "查看结果" : "下一题";
  btnNext.disabled = ans[idx]===null;
}

function pick(v) {
  ans[idx] = v;
  var btns = document.querySelectorAll("#qOpts .opt");
  btns.forEach(function(b){ b.classList.remove("sel"); });
  btns[v==="A"?0:1].classList.add("sel");
  document.getElementById("btnNext").disabled = false;
}

function prev() {
  if (idx>0) { idx--; renderQ(); }
}

function next() {
  if (ans[idx]===null) return;
  if (idx < Q.length-1) { idx++; renderQ(); }
  else { showResult(); }
}

// ====== 计分+结果 ======
function showResult() {
  var sc = { EI:{A:0,B:0}, SN:{A:0,B:0}, TF:{A:0,B:0}, JP:{A:0,B:0} };
  Q.forEach(function(q,i){
    if (ans[i]==="A") sc[q.d].A++;
    else if (ans[i]==="B") sc[q.d].B++;
  });

  var code = "";
  var dimData = {};
  ["EI","SN","TF","JP"].forEach(function(d){
    var total = sc[d].A + sc[d].B;
    var aPct = total>0 ? Math.round(sc[d].A/total*100) : 50;
    var bPct = 100 - aPct;
    if (sc[d].A >= sc[d].B) code += DIM[d].A;
    else code += DIM[d].B;
    dimData[d] = { aPct:aPct, bPct:bPct, winner: sc[d].A>=sc[d].B ? "A":"B" };
  });

  var td = T[code] || T.INTJ;

  document.getElementById("rCode").textContent = code;
  document.getElementById("rName").textContent = td.n;
  document.getElementById("rNick").textContent = td.e;
  document.getElementById("rGrp").textContent = td.g;
  document.getElementById("rDesc").textContent = td.d;

  // 四维度
  var dimsHtml = "";
  ["EI","SN","TF","JP"].forEach(function(d){
    var dm = DIM[d];
    var dd = dimData[d];
    var winName = dd.winner==="A" ? dm.Aname : dm.Bname;
    var winDesc = dd.winner==="A" ? dm.Adesc : dm.Bdesc;
    var aLabel = dm.Aname.split(" ")[0];
    var bLabel = dm.Bname.split(" ")[0];
    dimsHtml +=
      '<div class="dim-row">' +
        '<div class="lbl"><span class="a">' + aLabel + ' ' + dd.aPct + '%</span><span class="b">' + bLabel + ' ' + dd.bPct + '%</span></div>' +
        '<div class="bar"><div class="fill" style="width:' + dd.aPct + '%;background:' + (dd.winner==="A"?"var(--c-primary)":"var(--c-text-l)") + '"></div></div>' +
        '<div class="desc">你的倾向：<strong>' + winName + '</strong> — ' + winDesc + '</div>' +
      '</div>';
  });
  document.getElementById("rDims").innerHTML = dimsHtml;

  // 优势
  var strHtml = "";
  td.s.forEach(function(s){ strHtml += "<li>" + s + "</li>"; });
  document.getElementById("rStr").innerHTML = strHtml;

  // 注意项
  var weakHtml = "";
  td.w.forEach(function(w){ weakHtml += '<li class="w">' + w + "</li>"; });
  document.getElementById("rWeak").innerHTML = weakHtml;

  show("s-result");
}
</script>
